<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Antigravity 余量</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-app-region: no-drag;
    user-select: none;
    overflow-x: hidden;
    overflow-y: auto;
  }
  body::-webkit-scrollbar {
    width: 4px;
  }
  body::-webkit-scrollbar-track {
    background: transparent;
  }
  body::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
  }
  .panel {
    position: relative;
    margin: 4px;
    background: linear-gradient(180deg, #262629 0%, #1a1a1c 100%);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
    color: rgba(255,255,255,0.85);
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  .title-row {
    display: flex; align-items: center; justify-content: space-between;
    -webkit-app-region: drag;
  }
  .title-left {
    display: flex; align-items: center; gap: 6px;
  }
  .title { font-size: 13px; font-weight: 600; color: #fff; }
  .tier-badge {
    font-size: 9px; font-weight: 500;
    padding: 1px 6px; border-radius: 10px;
    background: rgba(59,130,246,0.18);
    color: #60a5fa;
    border: 1px solid rgba(59,130,246,0.3);
  }
  .close-btn {
    -webkit-app-region: no-drag;
    width: 18px; height: 18px; border-radius: 50%;
    border: none; background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.5); font-size: 11px;
    cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .close-btn:hover { background: rgba(255,59,48,0.6); color: #fff; }

  .account-row {
    font-size: 11px; color: rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 2px;
    -webkit-app-region: drag;
  }
  .model-banner {
    font-size: 11px;
    padding: 4px 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .model-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #30D158;
    box-shadow: 0 0 6px rgba(48,209,88,0.6);
  }
  .model-name {
    font-weight: 500; color: rgba(255,255,255,0.9);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .group-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 8px 10px;
    display: flex; flex-direction: column; gap: 6px;
    transition: border-color 0.2s, background 0.2s;
  }
  .group-card.active {
    border-color: rgba(48,209,88,0.35);
    background: rgba(48,209,88,0.03);
  }
  .group-header {
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .group-title {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.85);
  }
  .group-active-tag {
    font-size: 9px; font-weight: 600;
    color: #30D158;
    background: rgba(48,209,88,0.12);
    padding: 1px 5px; border-radius: 6px;
  }
  .group-desc {
    font-size: 10px; color: rgba(255,255,255,0.4);
    margin-top: -2px; margin-bottom: 2px;
  }

  .bucket-row {
    display: flex; flex-direction: column; gap: 3px;
  }
  .bucket-top {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px;
  }
  .bucket-name {
    color: rgba(255,255,255,0.7);
  }
  .bucket-pct {
    font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .progress-bg {
    height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }
  .progress-bar {
    height: 100%; border-radius: 3px;
    transition: width 0.5s ease;
  }
  .bucket-reset {
    font-size: 10px; color: rgba(255,255,255,0.4);
    font-variant-numeric: tabular-nums;
  }

  .footer-note {
    font-size: 10px; color: rgba(255,255,255,0.35);
    line-height: 1.35;
    padding: 2px 2px 0 2px;
  }

  .btn-row {
    display: flex; justify-content: center; gap: 8px;
    margin-top: 4px;
  }
  .refresh-btn {
    -webkit-app-region: no-drag;
    padding: 4px 16px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.7);
    font-size: 11px; cursor: pointer;
    transition: all 0.2s;
  }
  .refresh-btn:hover {
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.95);
  }

  .error-state {
    text-align: center; padding: 12px 6px;
    color: rgba(255,255,255,0.5); font-size: 12px;
    line-height: 1.5;
  }
  .loading-state {
    text-align: center; padding: 16px 0;
    color: rgba(255,255,255,0.4); font-size: 12px;
  }
</style>
</head>
<body>
  <div class="panel" id="root">
    <div class="loading-state">加载中...</div>
  </div>

  <script>
    var lastRefreshTime = Date.now();
    var REFRESH_INTERVAL = 180000; // 默认 3 min
    var countdownTimer = null;
    var resizeObserver = null;

    if (window.tooltipAPI && window.tooltipAPI.getPollInterval) {
      window.tooltipAPI.getPollInterval().then(function(minutes) {
        REFRESH_INTERVAL = minutes * 60000;
      });
    }
    if (window.tooltipAPI && window.tooltipAPI.getLastAgyRefreshTime) {
      window.tooltipAPI.getLastAgyRefreshTime().then(function(time) {
        if (time) lastRefreshTime = time;
      });
    }

    function getRemainingStr() {
      var remaining = Math.max(0, REFRESH_INTERVAL - (Date.now() - lastRefreshTime));
      var totalSec = Math.ceil(remaining / 1000);
      var min = Math.floor(totalSec / 60);
      var sec = totalSec % 60;
      return min + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function startCountdown() {
      if (countdownTimer) clearInterval(countdownTimer);
      countdownTimer = setInterval(function() {
        var btn = document.querySelector('.refresh-btn');
        if (!btn || btn.disabled) return;
        var remaining = Math.max(0, REFRESH_INTERVAL - (Date.now() - lastRefreshTime));
        if (remaining <= 0) {
          clearInterval(countdownTimer);
          countdownTimer = null;
          doRefresh();
        } else {
          btn.textContent = '刷新 (' + getRemainingStr() + ')';
        }
      }, 1000);
    }

    var lastSentHeight = 0;
    var resizeRaf = null;

    // 测量内容高度并防抖通知主进程
    function measureAndResize() {
      if (!window.tooltipAPI || !window.tooltipAPI.resizeAgy) return;
      var panel = document.getElementById('root');
      if (!panel) return;
      var rect = panel.getBoundingClientRect();
      var targetH = Math.ceil(rect.height + 8);
      // 仅当高度发生实际改变且有效时才发送
      if (targetH !== lastSentHeight && targetH > 40) {
        lastSentHeight = targetH;
        window.tooltipAPI.resizeAgy(targetH);
      }
    }

    function resizeToContent() {
      if (resizeRaf) cancelAnimationFrame(resizeRaf);
      resizeRaf = requestAnimationFrame(function() {
        measureAndResize();
      });
    }

    function ensureResizeObserver() {
      if (!window.ResizeObserver) return;
      var panel = document.getElementById('root');
      if (!panel) return;
      if (resizeObserver) resizeObserver.disconnect();
      resizeObserver = new ResizeObserver(function() {
        resizeToContent();
      });
      resizeObserver.observe(panel);
    }

    function getQuotaColor(pct) {
      if (pct > 50) return '#30D158'; // 充裕 (绿)
      if (pct >= 20) return '#FF9F0A'; // 预警 (黄)
      return '#FF3B30'; // 紧张 (红)
    }

    function formatBucketReset(bucket) {
      if (!bucket) return '';
      var sec = bucket.resetInSeconds;
      if (bucket.resetTime) {
        var diff = Math.floor((new Date(bucket.resetTime).getTime() - Date.now()) / 1000);
        if (!isNaN(diff) && diff >= 0) sec = diff;
      }
      if (sec != null && sec > 0) {
        var days = Math.floor(sec / 86400);
        var hours = Math.floor((sec % 86400) / 3600);
        var mins = Math.floor((sec % 3600) / 60);
        if (days > 0) return days + 'd ' + hours + 'h ' + mins + 'm';
        if (hours > 0) return hours + 'h ' + mins + 'm';
        return mins + 'm';
      }
      return bucket.resetText || '';
    }

    function renderBucket(title, bucket) {
      if (!bucket) return '';
      var pct = bucket.remainingPercent != null ? bucket.remainingPercent : 0;
      var color = getQuotaColor(pct);
      var resetText = formatBucketReset(bucket);
      var resetHtml = resetText ? '<div class="bucket-reset">重置倒计时: ' + resetText + '</div>' : '';

      return '<div class="bucket-row">' +
        '<div class="bucket-top">' +
          '<span class="bucket-name">' + title + '</span>' +
          '<span class="bucket-pct" style="color:' + color + '">' + (bucket.displayPercent || (pct + '%')) + '</span>' +
        '</div>' +
        '<div class="progress-bg">' +
          '<div class="progress-bar" style="width:' + Math.min(Math.max(pct, 0), 100) + '%;background:' + color + '"></div>' +
        '</div>' +
        resetHtml +
      '</div>';
    }

    function renderGroup(title, desc, groupData, isActive) {
      if (!groupData) return '';
      var fiveHourHtml = renderBucket('5小时剩余配额', groupData.fiveHour);
      var weeklyHtml = renderBucket('周剩余配额', groupData.weekly);

      return '<div class="group-card' + (isActive ? ' active' : '') + '">' +
        '<div class="group-header">' +
          '<span class="group-title">' + title + '</span>' +
          (isActive ? '<span class="group-active-tag">当前使用</span>' : '') +
        '</div>' +
        fiveHourHtml +
        weeklyHtml +
      '</div>';
    }

    function renderUsage(data) {
      var root = document.getElementById('root');

      if (!data || !data.isValid) {
        root.innerHTML =
          '<div class="title-row">' +
            '<div class="title-left">' +
              '<span class="title">Models &amp; Quota</span>' +
            '</div>' +
            '<button class="close-btn" onclick="window.close()">×</button>' +
          '</div>' +
          '<div class="error-state">未获取到 Antigravity 配额数据<br>' +
            '<span style="font-size:10px;opacity:0.6">' +
              (data && data.error ? data.error : '请运行 Antigravity 或检查 status-line 配置') +
            '</span>' +
          '</div>' +
          '<div class="btn-row">' +
            '<button class="refresh-btn" onclick="doRefresh()">刷新 (' + getRemainingStr() + ')</button>' +
          '</div>';
        ensureResizeObserver();
        resizeToContent();
        startCountdown();
        return;
      }

      var email = data.email ? ('Account: ' + data.email) : '';
      var planTier = data.planTier || '';
      var activeModel = data.activeModel || 'Gemini 3.8 Flash (Medium)';
      var isGeminiActive = data.activeGroup === 'gemini';
      var is3PActive = data.activeGroup === '3p';

      var html = '<div class="title-row">' +
        '<div class="title-left">' +
          '<span class="title">Models &amp; Quota</span>' +
          (planTier ? '<span class="tier-badge">' + planTier + '</span>' : '') +
        '</div>' +
        '<button class="close-btn" onclick="window.close()">×</button>' +
      '</div>';

      if (email) {
        html += '<div class="account-row"><span>' + email + '</span></div>';
      }

      html += '<div class="model-banner">' +
        '<div class="model-dot"></div>' +
        '<span style="opacity:0.6">当前模型:</span>' +
        '<span class="model-name">' + activeModel + '</span>' +
      '</div>';

      // 渲染 Gemini 组
      if (data.gemini) {
        html += renderGroup('GEMINI MODELS', 'Models within this group: Gemini Flash, Gemini Pro', data.gemini, isGeminiActive);
      }

      // 渲染 Claude / GPT 组
      if (data.threeP) {
        html += renderGroup('CLAUDE AND GPT MODELS', 'Models within this group: Claude Opus, Claude Sonnet, GPT-OSS', data.threeP, is3PActive);
      }

      html += '<div class="footer-note">各模型组独立共享配额，额度消耗与模型成本成比例。</div>';

      html += '<div class="btn-row">' +
        '<button class="refresh-btn" onclick="doRefresh()">刷新 (' + getRemainingStr() + ')</button>' +
      '</div>';

      root.innerHTML = html;
      ensureResizeObserver();
      resizeToContent();
      startCountdown();
    }

    function doRefresh() {
      var btn = document.querySelector('.refresh-btn');
      if (btn) { btn.disabled = true; btn.textContent = '刷新中...'; }
      if (window.tooltipAPI && window.tooltipAPI.refreshAgy) {
        window.tooltipAPI.refreshAgy().then(function(data) {
          lastRefreshTime = Date.now();
          window.__agyData = data;
          renderUsage(data);
        }).catch(function() {
          if (btn) { btn.disabled = false; btn.textContent = '刷新失败'; }
        });
      }
    }

    window.addEventListener('load', function() {
      if (window.__agyData) {
        renderUsage(window.__agyData);
      }
    });
  </script>
</body>
</html>
